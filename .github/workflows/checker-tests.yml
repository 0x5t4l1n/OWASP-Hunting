name: Duplicate checker tests

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/checker-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/checker-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
